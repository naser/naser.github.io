name: Deploy Search Console verification
on:
  push:
    paths:
      - '.github/workflows/gsc-verify-deploy.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verification tag
        run: |
          echo '' | base64 --decode | gzip -d | git apply
          rm .github/workflows/gsc-verify-deploy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Verify threadslab.org in Search Console'
          git push
