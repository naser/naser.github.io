name: Apply SEO migration
on:
  push:
    paths:
      - '.github/workflows/seo-migration.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the validated SEO patch
        run: |
          echo '' | base64 --decode | gzip -d | git apply --binary
          rm .github/workflows/seo-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete custom-domain SEO migration'
          git push
